version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm@9.0.0
        - cd ../.. && pnpm install --no-frozen-lockfile
    build:
      commands:
        - cd ../.. && pnpm --filter @bloom/landing run build
  artifacts:
    baseDirectory: out
    files:
      - '**/*'
  cache:
    paths:
      - ../../node_modules/**/*
      - node_modules/**/*
