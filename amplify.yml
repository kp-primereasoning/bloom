version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm@9.0.0
        - pnpm install --no-frozen-lockfile
    build:
      commands:
        - pnpm --filter @bloom/landing run build
  artifacts:
    baseDirectory: apps/landing/out
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - apps/landing/node_modules/**/*
